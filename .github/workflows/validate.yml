name: Validate

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  run_tests:
    name: Run Tests
    runs-on: windows-latest
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4
      - name: Run Tests on PowerShell 7
        shell: pwsh
        run: pwsh -NoProfile -File tests/run-tests.ps1
      - name: Run Tests on Windows PowerShell 5.1
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/run-tests.ps1

  check_format:
    name: Check Format
    runs-on: windows-latest
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
      - name: Check PowerShell Format
        shell: pwsh
        run: pwsh -NoProfile -File scripts/format.ps1 -Check
